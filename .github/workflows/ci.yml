name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go, TypeScript, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, vet and unit tests
        run: make test

      - name: Build binary
        run: make build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Chromium)
        run: |
          python3 -m pip install --upgrade playwright
          python3 -m playwright install --with-deps chromium

      - name: Browser tests (phone, tablet, desktop)
        run: python3 tests/ui/run_ui_tests.py --binary out/yarrow

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/

  docker:
    name: Docker image (${{ matrix.platform }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose -f compose.yaml config -q

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: yarrow:local
          build-args: |
            VERSION=${{ github.ref_name }}
            GITHASH=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Run container and wait for healthy
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 90); do
            status=$(docker inspect --format '{{.State.Health.Status}}' yarrow)
            echo "health: $status"
            [ "$status" = healthy ] && break
            sleep 2
          done
          [ "$status" = healthy ]
          docker inspect --format 'arch={{.Architecture}}' yarrow:local
          docker exec yarrow /usr/local/bin/yarrow -version

      - name: Data persists across re-creation
        run: |
          curl -fsS -X POST localhost:7070/api/folders -H 'content-type: application/json' -d '{"title":"ci-persist"}'
          docker compose down
          docker compose up -d --no-build
          for i in $(seq 1 60); do curl -fsS localhost:7070/healthz && break; sleep 2; done
          curl -fsS localhost:7070/api/folders | grep ci-persist

      - name: Only the loopback port is published
        run: |
          docker port yarrow
          test "$(docker port yarrow)" = "7070/tcp -> 127.0.0.1:7070"

      - name: Logs
        if: always()
        run: docker compose logs

  publish:
    # Publishing is opt-in: set the repository variable PUBLISH_IMAGE=true
    # and push a version tag (v*). Nothing is pushed otherwise.
    name: Publish multi-arch image to GHCR
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GITHASH=${{ github.sha }}
          cache-from: type=gha,scope=linux/amd64
